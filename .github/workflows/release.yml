name: Release

# Arma Bajalo-win64.zip (Bajalo.exe con Node, yt-dlp y FFmpeg adentro) en un Windows de GitHub.
# Al subir un tag vX.Y.Z lo publica como Release; a mano (Run workflow) queda como artefacto para probarlo.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # crear el Release
  id-token: write      # certificar de qué commit salió el ZIP
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test
      - run: node tools/build.js --zip
      # La certificación de procedencia es gratis en los repos públicos.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/Bajalo-win64.zip
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: Bajalo-win64
          path: dist/Bajalo-win64.zip
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $hash = (Get-FileHash dist/Bajalo-win64.zip -Algorithm SHA256).Hash.ToLower()
          @(
            'Bajá **Bajalo-win64.zip**, descomprimilo y abrí **Bajalo.exe**. No hace falta instalar nada.'
            ''
            'Si Windows avisa que "protegió tu PC", tocá **Más información** y después **Ejecutar de todas formas**. Para que no aparezca, antes de descomprimir: clic derecho en el ZIP → **Propiedades** → **Desbloquear**.'
            ''
            "SHA-256 del ZIP: ``$hash``"
          ) | Set-Content -Encoding utf8 dist/notas.md
          gh release create $env:TAG dist/Bajalo-win64.zip dist/Bajalo-win64.zip.sha256 --title "Bajalo $env:TAG" --notes-file dist/notas.md
